<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bilgi Girişi</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .kutu {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 24px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    h2 {
      text-align: center;
      color: #38bdf8;
      margin-bottom: 20px;
      font-size: 20px;
    }
    .alan {
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 12px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #ffffff;
      font-size: 15px;
      outline: none;
    }
    input:focus {
      border-color: #38bdf8;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    button:active {
      background: #0369a1;
    }
    .kart {
      display: none;
      margin-top: 20px;
      background: #0f172a;
      border: 1px solid #38bdf8;
      border-radius: 10px;
      padding: 16px;
    }
    .kart p {
      margin-bottom: 8px;
      font-size: 15px;
    }
    .kart span {
      color: #38bdf8;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="kutu">
    <h2>Bilgilerini Gir</h2>

    <div class="alan">
      <label for="ad">Adın</label>
      <input type="text" id="ad" placeholder="Adını buraya yaz...">
    </div>

    <div class="alan">
      <label for="soyad">Soyadın</label>
      <input type="text" id="soyad" placeholder="Soyadını buraya yaz...">
    </div>

    <div class="alan">
      <label for="dogum">Doğum Tarihin</label>
      <input type="text" id="dogum" placeholder="GG/AA/YYYY" maxlength="10" inputmode="numeric">
    </div>

    <button onclick="bilgileriGoster()">Kaydet ve Göster</button>

    <div class="kart" id="sonucAlani">
      <p>Ad: <span id="yazilanAd"></span></p>
      <p>Soyad: <span id="yazilanSoyad"></span></p>
      <p>Doğum Tarihi: <span id="yazilanDogum"></span></p>
    </div>
  </div>

  <script>
    const dogumInput = document.getElementById('dogum');

    // Otomatik slash ekleme mantığı
    dogumInput.addEventListener('input', function(e) {
      let deger = e.target.value.replace(/\D/g, ''); // Sadece rakamları al
      if (deger.length > 8) deger = deger.substring(0, 8);

      let bicimliDeger = '';
      if (deger.length > 0) {
        bicimliDeger = deger.substring(0, 2);
      }
      if (deger.length >= 3) {
        bicimliDeger += '/' + deger.substring(2, 4);
      }
      if (deger.length >= 5) {
        bicimliDeger += '/' + deger.substring(4, 8);
      }

      e.target.value = bicimliDeger;
    });

    function bilgileriGoster() {
      const girilenAd = document.getElementById('ad').value;
      const girilenSoyad = document.getElementById('soyad').value;
      const girilenDogum = document.getElementById('dogum').value;

      if (!girilenAd || !girilenSoyad || !girilenDogum) {
        alert("Lütfen tüm kutuları eksiksiz doldur!");
        return;
      }

      if (girilenDogum.length < 10) {
        alert("Lütfen doğum tarihini tam gir (GG/AA/YYYY)!");
        return;
      }

      document.getElementById('yazilanAd').textContent = girilenAd;
      document.getElementById('yazilanSoyad').textContent = girilenSoyad;
      document.getElementById('yazilanDogum').textContent = girilenDogum;

      document.getElementById('sonucAlani').style.display = 'block';
    }
  </script>

</body>
</html>
