<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil Kartı</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 32px 24px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
      text-align: center;
    }
    .avatar {
      width: 70px;
      height: 70px;
      background: #0284c7;
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: bold;
      margin: 0 auto 20px;
    }
    .info-group {
      background: #0f172a;
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #1e293b;
    }
    .label {
      font-size: 13px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .value {
      font-size: 15px;
      font-weight: 600;
      color: #38bdf8;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="avatar">H</div>

    <div class="info-group">
      <span class="label">Ad</span>
      <!-- Buradaki Hasan yazısını değiştirebilirsin -->
      <span class="value">Hasan</span>
    </div>

    <div class="info-group">
      <span class="label">Soyad</span>
      <!-- Buraya soyadını yazabilirsin -->
      <span class="value">Soyadın</span>
    </div>

    <div class="info-group">
      <span class="label">Doğum Tarihi</span>
      <!-- Buraya doğum tarihini yazabilirsin -->
      <span class="value">01.01.2012</span>
    </div>
  </div>

</body>
</html>
